<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <title>Chris's Grocery List</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Grocery List</h1>
    <p class="sub">Check an item and it leaves the active list. Show checked items to undo one.</p>
    <div id="error" class="error" hidden>Could not load the grocery list. Try again when you have a connection.</div>
    <p id="status" class="status">Loading…</p>
    <div class="toolbar">
      <button id="toggleCompleted" class="secondary" type="button">Show checked</button>
      <button id="uncheckAll" class="secondary" type="button">Uncheck all</button>
    </div>
    <div id="active"></div>
    <div id="completed" hidden></div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
